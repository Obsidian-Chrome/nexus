name: Fetch Discord Events

on:
  schedule:
    - cron: '*/5 * * * *'  # Toutes les 5 minutes
  workflow_dispatch:  # Permet de lancer manuellement

jobs:
  fetch-events:
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
      
      - name: Fetch Discord events
        run: |
          curl -X GET \
            -H "Authorization: Bot ${{ secrets.DISCORD_BOT_TOKEN }}" \
            -H "Content-Type: application/json" \
            "https://discord.com/api/v10/guilds/${{ secrets.DISCORD_GUILD_ID }}/scheduled-events" \
            | jq 'map({
              id: .id,
              name: .name,
              description: .description,
              scheduledStartTime: .scheduled_start_time,
              scheduledEndTime: .scheduled_end_time,
              location: .entity_metadata.location,
              status: .status,
              userCount: .user_count,
              image: (if .image then "https://cdn.discordapp.com/guild-events/" + .id + "/" + .image + ".png?size=1024" else null end),
              creator: {
                id: .creator.id,
                username: .creator.username,
                avatar: (if .creator.avatar then "https://cdn.discordapp.com/avatars/" + .creator.id + "/" + .creator.avatar + ".png" else null end)
              }
            })' > src/data/events.json
      
      - name: Check for changes
        id: git-check
        run: |
          git diff --quiet src/data/events.json || echo "changed=true" >> $GITHUB_OUTPUT
      
      - name: Commit and push if changed
        if: steps.git-check.outputs.changed == 'true'
        run: |
          git config user.name "GitHub Actions"
          git config user.email "actions@github.com"
          git add src/data/events.json
          git commit -m "Update Discord events - $(date -u +'%Y-%m-%d %H:%M UTC')"
          git push
